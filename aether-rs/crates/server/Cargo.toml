[package]
name = "server"
version = "0.1.0"
edition = "2021"

[features]
default = ["db-sqlite"]
db-sqlite = ["sqlx/sqlite", "services/db-sqlite"]
db-postgres = ["sqlx/postgres", "services/db-postgres"]

[dependencies]
models = { path = "../models" }
services = { path = "../services", default-features = false }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true }
sha2.workspace = true
crdt = { version = "0.1.0", path = "../crdt" }
diffy = "0.5.0"
once_cell = "1.18.0"

[dev-dependencies]
reqwest = { version = "0.13.3", features = ["json"] }

